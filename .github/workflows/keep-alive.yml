name: Supabase Keep Alive

on:
  schedule:
    # Run daily at 09:00 UTC (14:30 IST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive API Endpoint
        run: |
          curl -i -X GET "https://www.jayasrimakeovers.in/api/keep-alive"

      - name: Ping Supabase Database Directly
        run: |
          if [ ! -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            curl -i -X GET "https://deqtivfdoqrjqyxydufg.supabase.co/rest/v1/orders?limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          else
            echo "SUPABASE_ANON_KEY secret is not set, skipping direct ping."
          fi
